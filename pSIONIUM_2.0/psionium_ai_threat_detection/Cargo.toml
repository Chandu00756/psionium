[package]
name = "psionium_ai_threat_detection"
version = "0.1.0"
edition = "2021"
description = "AI-driven threat detection module for Psionium"
license = "MIT"

[dependencies]
smartcore = "0.3.2"       # For random forest classifier
log = "0.4.21"            # Logging framework
env_logger = "0.11.3"     # Console logging
serde = { version = "1.0.197", features = ["derive"] }  # Serialization for model updates
bincode = "1.3.3"         # Binary encoding
notify = "6.1.1"          # Real-time filesystem monitoring
ed25519-dalek = { version = "2.0.0", features = ["pkcs8"] }  # Cryptographic signatures with pkcs8 support
tokio = { version = "1.40.0", features = ["full"] }  # Asynchronous runtime
rand = "0.8.5"            # Randomness for key generation

[dev-dependencies]
criterion = "0.5.1"       # Benchmarking

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bench]]
name = "threat_detection_bench"
harness = false