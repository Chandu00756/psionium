[package]
name = "psionium-scan"
description = "Quantum-readiness scanner: finds quantum-vulnerable cryptography in code, dependencies, certificates, keys and TLS endpoints"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aws-lc-rs = "1.18.2"
base64 = "0.23.1"
ignore = "0.4.30"
regex = "1.13.1"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.2"
webpki-roots = "1.0.9"
x509-parser = "0.18.1"

[dev-dependencies]
base64 = "0.23.1"
rcgen = "0.14.7"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
