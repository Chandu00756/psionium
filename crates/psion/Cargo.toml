[package]
name = "psion"
description = "Command-line tool for pSIONIUM post-quantum file encryption"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
psionium-core = { version = "1.1.0", path = "../psionium-core" }
psionium-scan = { version = "1.1.0", path = "../psionium-scan" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = "1.1.8"
zeroize = "1.9.1"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
predicates = "3.1.4"
serde_json = "1.0.154"
tempfile = "3.27.0"
