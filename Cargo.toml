[workspace]
resolver = "2"
members = ["crates/psionium-core", "crates/psion", "crates/psionium-scan"]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Chandu00756/psionium"
rust-version = "1.88"

[profile.release]
lto = "thin"
codegen-units = 1

# Argon2 is unusably slow unoptimized; keep it fast in debug builds and tests.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
